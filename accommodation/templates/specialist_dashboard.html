<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniHaven - Specialist Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'}}}}}</script>
    <style>.lbl{display:block;font-size:.75rem;font-weight:500;color:#4b5563;margin-bottom:.25rem}.inp{width:100%;border-radius:.375rem;border:1px solid #d1d5db;box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:.875rem;padding:.5rem .75rem}.inp:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}</style>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-white border-b border-gray-200 sticky top-0 z-40"><div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-14"><span class="text-lg font-semibold text-primary-700 tracking-tight">UniHaven</span><div class="flex items-center gap-3"><select id="university-selector" class="rounded-md border-gray-300 shadow-sm text-sm py-1.5 px-3 border"><option value="HKU">HKU</option><option value="HKUST">HKUST</option><option value="CUHK">CUHK</option></select><span class="text-xs text-gray-500">Specialist Dashboard</span></div></div></nav>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex gap-2 mb-6 border-b border-gray-200">
        <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-primary-600 text-primary-700" data-tab="accommodations">Accommodations</button>
        <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700" data-tab="reservations">Reservations</button>
        <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 relative" data-tab="notifications">Notifications<span id="notification-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span></button>
        <button class="tab px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700" data-tab="owners">Owners</button>
    </div>
    <div id="accommodations-tab" class="tab-content"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-semibold text-gray-900">Accommodations</h2><button id="add-accommodation-btn" class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Add New</button></div><div id="accommodations-list" class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden"></div></div>
    <div id="reservations-tab" class="tab-content hidden"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-semibold text-gray-900">Reservations</h2><select id="reservation-status-filter" class="rounded-md border-gray-300 shadow-sm text-sm py-1.5 px-3 border"><option value="">All</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="reservations-list" class="space-y-3"></div></div>
    <div id="notifications-tab" class="tab-content hidden"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-semibold text-gray-900">Notifications</h2><button id="mark-all-read-btn" class="text-sm text-primary-600 hover:text-primary-800 font-medium">Mark All Read</button></div><div id="notifications-list" class="space-y-3"></div></div>
    <div id="owners-tab" class="tab-content hidden"><div class="flex justify-between items-center mb-4"><h2 class="text-lg font-semibold text-gray-900">Property Owners</h2><button id="add-owner-btn" class="bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Add Owner</button></div><div id="owners-list" class="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden"></div></div>
</div>
<div id="add-accommodation-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-start justify-center pt-8 px-4"><div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative"><button class="modal-close absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl">&times;</button><h2 class="text-lg font-semibold text-gray-900 mb-4">Add New Accommodation</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="sm:col-span-2"><label class="lbl">Title</label><input type="text" id="add-title" class="inp"></div><div class="sm:col-span-2"><label class="lbl">Description</label><textarea id="add-description" rows="3" class="inp"></textarea></div><div><label class="lbl">Type</label><select id="add-type" class="inp"><option value="flat">Flat</option><option value="hall">Mini Hall</option><option value="room">Room</option></select></div><div><label class="lbl">Price (HKD/mo)</label><input type="number" id="add-price" min="0" class="inp"></div><div><label class="lbl">Beds</label><input type="number" id="add-beds" min="1" class="inp"></div><div><label class="lbl">Bedrooms</label><input type="number" id="add-bedrooms" min="1" class="inp"></div><div><label class="lbl">Available From</label><input type="date" id="add-available-from" class="inp"></div><div><label class="lbl">Available Until</label><input type="date" id="add-available-until" class="inp"></div><div><label class="lbl">Building Name</label><input type="text" id="add-building-name" class="inp"></div><div><label class="lbl">Owner</label><select id="add-owner" class="inp">{% for owner in owners %}<option value="{{ owner.id }}">{{ owner.name }}</option>{% endfor %}</select></div><div class="sm:col-span-2"><label class="lbl">Universities</label><select id="add-universities" multiple class="inp h-20"><option value="1">HKU</option><option value="2">HKUST</option><option value="3">CUHK</option></select></div></div><div class="flex gap-2 mt-4"><button id="lookup-address-btn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Lookup Address</button></div><div id="location-details" class="hidden mt-3 p-3 bg-green-50 rounded-md text-sm text-green-800"><p id="location-address"></p><p id="location-coordinates" class="text-xs text-green-600"></p><input type="hidden" id="location-id"></div><div class="flex gap-2 mt-4"><button id="submit-accommodation-btn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Add</button><button class="modal-close bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Cancel</button></div></div></div>
<div id="edit-accommodation-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-start justify-center pt-8 px-4"><div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative"><button class="modal-close absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl">&times;</button><h2 class="text-lg font-semibold text-gray-900 mb-4">Edit Accommodation</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><div class="sm:col-span-2"><label class="lbl">Title</label><input type="text" id="edit-title" class="inp"></div><div class="sm:col-span-2"><label class="lbl">Description</label><textarea id="edit-description" rows="3" class="inp"></textarea></div><div><label class="lbl">Type</label><select id="edit-type" class="inp"><option value="hall">Mini Hall</option><option value="room">Room</option><option value="flat">Flat</option></select></div><div><label class="lbl">Price</label><input type="number" id="edit-price" min="0" class="inp"></div><div><label class="lbl">Beds</label><input type="number" id="edit-beds" min="1" class="inp"></div><div><label class="lbl">Bedrooms</label><input type="number" id="edit-bedrooms" min="1" class="inp"></div><div><label class="lbl">From</label><input type="date" id="edit-available-from" class="inp"></div><div><label class="lbl">Until</label><input type="date" id="edit-available-until" class="inp"></div><div><label class="lbl">Owner</label><select id="edit-owner" class="inp">{% for owner in owners %}<option value="{{ owner.id }}">{{ owner.name }}</option>{% endfor %}</select></div><div><label class="lbl">Universities</label><select id="edit-universities" multiple class="inp h-20"><option value="1">HKU</option><option value="2">HKUST</option><option value="3">CUHK</option></select></div></div><input type="hidden" id="edit-accommodation-id"><input type="hidden" id="edit-location-id"><div class="flex gap-2 mt-4"><button id="update-accommodation-btn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Update</button><button class="modal-close bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Cancel</button></div></div></div>
<div id="add-owner-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4"><div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative"><button class="modal-close absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl">&times;</button><h2 class="text-lg font-semibold text-gray-900 mb-4">Add Owner</h2><div class="space-y-3"><div><label class="lbl">Name</label><input type="text" id="owner-name" class="inp"></div><div><label class="lbl">Contact</label><input type="text" id="owner-contact" class="inp"></div></div><div class="flex gap-2 mt-4"><button id="submit-owner-btn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Add</button><button class="modal-close bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Cancel</button></div></div></div>
<div id="edit-owner-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4"><div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative"><button class="modal-close absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl">&times;</button><h2 class="text-lg font-semibold text-gray-900 mb-4">Edit Owner</h2><div class="space-y-3"><div><label class="lbl">Name</label><input type="text" id="edit-owner-name" class="inp"></div><div><label class="lbl">Contact</label><input type="text" id="edit-owner-contact" class="inp"></div></div><input type="hidden" id="edit-owner-id"><div class="flex gap-2 mt-4"><button id="update-owner-btn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Update</button><button class="modal-close bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Cancel</button></div></div></div>
<div id="reservation-detail-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-start justify-center pt-12 px-4"><div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative"><button class="modal-close absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl">&times;</button><h2 class="text-lg font-semibold text-gray-900 mb-4">Reservation Details</h2><div id="reservation-detail-content" class="text-sm text-gray-700 space-y-1 mb-4"></div><div class="flex gap-2 flex-wrap"><button id="confirm-reservation-btn" class="hidden bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Confirm</button><button id="complete-reservation-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Complete</button><button id="cancel-reservation-btn" class="hidden bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-2 px-4 rounded-md transition">Cancel</button><button class="modal-close bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 px-4 rounded-md transition">Close</button></div></div></div>
<script>
document.addEventListener('DOMContentLoaded',function(){let selectedUniversity='HKU';const bc={pending:'bg-yellow-100 text-yellow-800',confirmed:'bg-green-100 text-green-800',completed:'bg-blue-100 text-blue-800',cancelled:'bg-red-100 text-red-800'};function badge(s){return'<span class="inline-block px-2 py-0.5 rounded text-xs font-medium '+(bc[s]||'')+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</span>'}
document.getElementById('university-selector').addEventListener('change',function(){selectedUniversity=this.value;const a=document.querySelector('.tab.border-primary-600');if(a)a.click()});
document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(b=>{b.classList.remove('border-primary-600','text-primary-700');b.classList.add('border-transparent','text-gray-500')});document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));this.classList.add('border-primary-600','text-primary-700');this.classList.remove('border-transparent','text-gray-500');const n=this.dataset.tab;document.getElementById(n+'-tab').classList.remove('hidden');({accommodations:loadAccommodations,reservations:loadReservations,notifications:loadNotifications,owners:loadOwners})[n]()})});
document.querySelectorAll('.modal-close').forEach(b=>b.addEventListener('click',function(){this.closest('[class*="fixed"]').classList.add('hidden')}));
document.querySelectorAll('#add-accommodation-modal,#edit-accommodation-modal,#add-owner-modal,#edit-owner-modal,#reservation-detail-modal').forEach(m=>m.addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden')}));
function loadAccommodations(){fetch('/api/accommodations/?university='+selectedUniversity).then(r=>r.json()).then(data=>{const items=data.results||data;const el=document.getElementById('accommodations-list');if(!items.length){el.innerHTML='<p class="p-6 text-gray-500 text-sm text-center">No accommodations.</p>';return}el.innerHTML='<table class="w-full text-sm"><thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase tracking-wider"><tr><th class="px-4 py-3">Title</th><th class="px-4 py-3">Type</th><th class="px-4 py-3">Price</th><th class="px-4 py-3">Beds</th><th class="px-4 py-3">Available</th><th class="px-4 py-3 text-right">Actions</th></tr></thead><tbody class="divide-y divide-gray-100">'+items.map(a=>'<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium text-gray-900">'+a.title+'</td><td class="px-4 py-3 text-gray-600">'+a.type+'</td><td class="px-4 py-3 text-gray-900">$'+Number(a.price).toLocaleString()+'</td><td class="px-4 py-3 text-gray-600">'+a.beds+'</td><td class="px-4 py-3 text-gray-500 text-xs">'+a.available_from+' ~ '+a.available_until+'</td><td class="px-4 py-3 text-right space-x-1"><button onclick="editAccom('+a.id+')" class="text-xs text-primary-600 hover:text-primary-800 font-medium">Edit</button><button onclick="deleteAccom('+a.id+')" class="text-xs text-red-600 hover:text-red-800 font-medium">Delete</button></td></tr>').join('')+'</tbody></table>'})}
window.editAccom=function(id){fetch('/api/accommodations/'+id+'/').then(r=>r.json()).then(a=>{document.getElementById('edit-title').value=a.title;document.getElementById('edit-description').value=a.description;document.getElementById('edit-type').value=a.type;document.getElementById('edit-price').value=a.price;document.getElementById('edit-beds').value=a.beds;document.getElementById('edit-bedrooms').value=a.bedrooms;document.getElementById('edit-available-from').value=a.available_from;document.getElementById('edit-available-until').value=a.available_until;document.getElementById('edit-owner').value=a.owner.id;document.getElementById('edit-accommodation-id').value=a.id;document.getElementById('edit-location-id').value=a.location.id;const sel=document.getElementById('edit-universities');Array.from(sel.options).forEach(o=>o.selected=false);if(a.universities)a.universities.forEach(u=>{Array.from(sel.options).forEach(o=>{if(parseInt(o.value)===u.id)o.selected=true})});document.getElementById('edit-accommodation-modal').classList.remove('hidden')})};
document.getElementById('update-accommodation-btn').addEventListener('click',function(){const id=document.getElementById('edit-accommodation-id').value;const uniSel=document.getElementById('edit-universities');const data={title:document.getElementById('edit-title').value,description:document.getElementById('edit-description').value,type:document.getElementById('edit-type').value,price:document.getElementById('edit-price').value,beds:parseInt(document.getElementById('edit-beds').value),bedrooms:parseInt(document.getElementById('edit-bedrooms').value),available_from:document.getElementById('edit-available-from').value,available_until:document.getElementById('edit-available-until').value,owner_id:parseInt(document.getElementById('edit-owner').value),location_id:parseInt(document.getElementById('edit-location-id').value),university_ids:Array.from(uniSel.selectedOptions).map(o=>parseInt(o.value))};fetch('/api/accommodations/'+id+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>{if(!r.ok)throw new Error('Failed');return r.json()}).then(()=>{document.getElementById('edit-accommodation-modal').classList.add('hidden');loadAccommodations()}).catch(e=>alert(e.message))});
window.deleteAccom=function(id){if(!confirm('Delete this accommodation?'))return;fetch('/api/accommodations/'+id+'/',{method:'DELETE'}).then(()=>loadAccommodations())};
function loadReservations(){const st=document.getElementById('reservation-status-filter').value;let url='/api/reservations/?university='+selectedUniversity;if(st)url+='&status='+st;fetch(url).then(r=>r.json()).then(data=>{const items=data.results||data;const el=document.getElementById('reservations-list');if(!items.length){el.innerHTML='<p class="text-gray-500 text-sm text-center py-8">No reservations.</p>';return}el.innerHTML=items.map(r=>'<div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4"><div class="flex justify-between items-center mb-1"><h3 class="text-sm font-semibold text-gray-900">'+r.accommodation.title+'</h3>'+badge(r.status)+'</div><p class="text-xs text-gray-500">'+r.member_name+' &middot; '+r.start_date+' ~ '+r.end_date+'</p><button onclick="viewRes('+r.id+')" class="text-xs text-primary-600 hover:text-primary-800 font-medium mt-2">View Details</button></div>').join('')})}
document.getElementById('reservation-status-filter').addEventListener('change',loadReservations);
window.viewRes=function(id){fetch('/api/reservations/'+id+'/').then(r=>r.json()).then(r=>{document.getElementById('reservation-detail-content').innerHTML='<div class="grid grid-cols-2 gap-x-4 gap-y-1"><div><span class="text-gray-500">Accommodation:</span> '+r.accommodation.title+'</div><div><span class="text-gray-500">Status:</span> '+badge(r.status)+'</div><div><span class="text-gray-500">Period:</span> '+r.start_date+' ~ '+r.end_date+'</div><div><span class="text-gray-500">University:</span> '+(r.university?r.university.name:'N/A')+'</div><div class="col-span-2 mt-2 font-medium text-gray-800">Member Info</div><div><span class="text-gray-500">Name:</span> '+r.member_name+'</div><div><span class="text-gray-500">Email:</span> '+r.member_email+'</div><div><span class="text-gray-500">Phone:</span> '+r.member_phone+'</div><div><span class="text-gray-500">User ID:</span> '+r.user_id+'</div></div>';const cb=document.getElementById('confirm-reservation-btn'),cmb=document.getElementById('complete-reservation-btn'),cab=document.getElementById('cancel-reservation-btn');cb.classList.add('hidden');cmb.classList.add('hidden');cab.classList.add('hidden');if(r.status==='pending'){cb.classList.remove('hidden');cab.classList.remove('hidden')}else if(r.status==='confirmed'){cmb.classList.remove('hidden')}[cb,cmb,cab].forEach(b=>b.dataset.id=r.id);document.getElementById('reservation-detail-modal').classList.remove('hidden')})};
['confirm','complete','cancel'].forEach(action=>{document.getElementById(action+'-reservation-btn').addEventListener('click',function(){if(!confirm(action.charAt(0).toUpperCase()+action.slice(1)+' this reservation?'))return;fetch('/api/reservations/'+this.dataset.id+'/'+action+'/',{method:'POST'}).then(r=>r.json()).then(()=>{document.getElementById('reservation-detail-modal').classList.add('hidden');loadReservations()})})});
function loadNotifications(){fetch('/api/notifications/?university='+selectedUniversity).then(r=>r.json()).then(data=>{const items=data.results||data;const el=document.getElementById('notifications-list');const unread=items.filter(n=>!n.is_read).length;const nb=document.getElementById('notification-badge');if(unread>0){nb.textContent=unread;nb.classList.remove('hidden')}else{nb.classList.add('hidden')}if(!items.length){el.innerHTML='<p class="text-gray-500 text-sm text-center py-8">No notifications.</p>';return}el.innerHTML=items.map(n=>'<div class="rounded-lg border p-4 '+(n.is_read?'bg-white border-gray-200':'bg-blue-50 border-blue-200')+'"><div class="flex justify-between items-center mb-1"><span class="text-sm font-medium text-gray-900">'+n.type.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())+'</span><span class="text-xs text-gray-400">'+new Date(n.created_at).toLocaleString()+'</span></div><p class="text-xs text-gray-600">'+n.message+'</p><div class="flex gap-2 mt-2"><button onclick="viewRes('+n.reservation.id+')" class="text-xs text-primary-600 hover:text-primary-800 font-medium">View</button>'+(!n.is_read?'<button onclick="markRead('+n.id+')" class="text-xs text-gray-500 hover:text-gray-700">Mark Read</button>':'')+'</div></div>').join('')})}
window.markRead=function(id){fetch('/api/notifications/'+id+'/mark_as_read/',{method:'POST'}).then(()=>loadNotifications())};
document.getElementById('mark-all-read-btn').addEventListener('click',function(){const btns=document.querySelectorAll('[onclick^="markRead"]');if(!btns.length)return;Promise.all(Array.from(btns).map(b=>{const id=b.getAttribute('onclick').match(/\d+/)[0];return fetch('/api/notifications/'+id+'/mark_as_read/',{method:'POST'})})).then(()=>loadNotifications())});
function loadOwners(){fetch('/api/owners/').then(r=>r.json()).then(data=>{const items=data.results||data;const el=document.getElementById('owners-list');if(!items.length){el.innerHTML='<p class="p-6 text-gray-500 text-sm text-center">No owners.</p>';return}el.innerHTML='<table class="w-full text-sm"><thead class="bg-gray-50 text-left text-xs text-gray-500 uppercase tracking-wider"><tr><th class="px-4 py-3">Name</th><th class="px-4 py-3">Contact</th><th class="px-4 py-3 text-right">Actions</th></tr></thead><tbody class="divide-y divide-gray-100">'+items.map(o=>'<tr class="hover:bg-gray-50"><td class="px-4 py-3 font-medium text-gray-900">'+o.name+'</td><td class="px-4 py-3 text-gray-600">'+o.contact+'</td><td class="px-4 py-3 text-right space-x-1"><button onclick="editOwner('+o.id+')" class="text-xs text-primary-600 hover:text-primary-800 font-medium">Edit</button><button onclick="deleteOwner('+o.id+')" class="text-xs text-red-600 hover:text-red-800 font-medium">Delete</button></td></tr>').join('')+'</tbody></table>'})}
window.editOwner=function(id){fetch('/api/owners/'+id+'/').then(r=>r.json()).then(o=>{document.getElementById('edit-owner-name').value=o.name;document.getElementById('edit-owner-contact').value=o.contact;document.getElementById('edit-owner-id').value=o.id;document.getElementById('edit-owner-modal').classList.remove('hidden')})};
document.getElementById('update-owner-btn').addEventListener('click',function(){const id=document.getElementById('edit-owner-id').value;fetch('/api/owners/'+id+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('edit-owner-name').value,contact:document.getElementById('edit-owner-contact').value})}).then(r=>{if(!r.ok)throw new Error('Failed');return r.json()}).then(()=>{document.getElementById('edit-owner-modal').classList.add('hidden');loadOwners()}).catch(e=>alert(e.message))});
window.deleteOwner=function(id){if(!confirm('Delete this owner?'))return;fetch('/api/owners/'+id+'/',{method:'DELETE'}).then(()=>loadOwners())};
document.getElementById('add-accommodation-btn').addEventListener('click',()=>document.getElementById('add-accommodation-modal').classList.remove('hidden'));
document.getElementById('lookup-address-btn').addEventListener('click',function(){const name=document.getElementById('add-building-name').value;if(!name){alert('Enter a building name');return}fetch('/api/locations/lookup_address/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,address:'string',latitude:0,longitude:0,geo_address:'string',is_campus:false})}).then(r=>{if(!r.ok)throw new Error('Not found');return r.json()}).then(d=>{document.getElementById('location-address').textContent=d.address;document.getElementById('location-coordinates').textContent=d.latitude+', '+d.longitude;document.getElementById('location-id').value=d.id;document.getElementById('location-details').classList.remove('hidden')}).catch(()=>alert('Address not found'))});
document.getElementById('submit-accommodation-btn').addEventListener('click',function(){const uniSel=document.getElementById('add-universities');const unis=Array.from(uniSel.selectedOptions).map(o=>parseInt(o.value));const locId=document.getElementById('location-id').value;if(!locId||!unis.length){alert('Lookup address and select universities first');return}const data={title:document.getElementById('add-title').value,description:document.getElementById('add-description').value,type:document.getElementById('add-type').value,price:document.getElementById('add-price').value,beds:parseInt(document.getElementById('add-beds').value),bedrooms:parseInt(document.getElementById('add-bedrooms').value),available_from:document.getElementById('add-available-from').value,available_until:document.getElementById('add-available-until').value,location_id:parseInt(locId),owner_id:parseInt(document.getElementById('add-owner').value),university_ids:unis};fetch('/api/accommodations/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>{if(!r.ok)throw new Error('Failed');return r.json()}).then(()=>{document.getElementById('add-accommodation-modal').classList.add('hidden');loadAccommodations()}).catch(e=>alert(e.message))});
document.getElementById('add-owner-btn').addEventListener('click',()=>document.getElementById('add-owner-modal').classList.remove('hidden'));
document.getElementById('submit-owner-btn').addEventListener('click',function(){const name=document.getElementById('owner-name').value,contact=document.getElementById('owner-contact').value;if(!name||!contact){alert('Fill all fields');return}fetch('/api/owners/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,contact})}).then(r=>{if(!r.ok)throw new Error('Failed');return r.json()}).then(()=>{document.getElementById('add-owner-modal').classList.add('hidden');loadOwners()}).catch(e=>alert(e.message))});
loadAccommodations()});
</script>
</body>
</html>
